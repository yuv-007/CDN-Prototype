services:
  
  edge-japan:
    build:
      context: .
      dockerfile: edge/Dockerfile
    environment:
      REDIS_HOST: redis-japan
      CACHE_TTL: "60"
      EDGE_ID: japan
      EDGE_LAT: "35.6762"
      EDGE_LON: "139.6503"
      ORIGIN_HOST: 52.78.19.134
    ports:
      - "8001:8001"
    depends_on:
      - redis-japan

  redis-japan:
    image: redis:7-alpine
