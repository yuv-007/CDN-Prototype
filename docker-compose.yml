services:

  origin:
    build:
      context: .
      dockerfile: origin/Dockerfile
    ports:
    - "8000:8000"

  edge-mumbai:
    build:
      context: .
      dockerfile: edge/Dockerfile
    environment:
      REDIS_HOST: redis-mumbai
      CACHE_TTL: "60"
      EDGE_ID: mumbai
      EDGE_LAT: "19.0760"
      EDGE_LON: "72.8777"
      ORIGIN_HOST: 52.78.19.134
    ports:
      - "8001:8001"
    depends_on:
      - redis-mumbai

  edge-virginia:
    build:
      context: .
      dockerfile: edge/Dockerfile
    environment:
      REDIS_HOST: redis-virginia
      CACHE_TTL: "60"
      EDGE_ID: virginia
      EDGE_LAT: "37.4316"
      EDGE_LON: "-78.6569"
      ORIGIN_HOST: 52.78.19.134    
    ports:
      - "8001:8001"
    depends_on:
      - redis-virginia

  edge-japan:
    build:
      context: .
      dockerfile: edge/Dockerfile
    environment:
      REDIS_HOST: redis-japan
      CACHE_TTL: "60"
      EDGE_ID: japan
      EDGE_LAT: "35.6762"
      EDGE_LON: "139.6503"
      ORIGIN_HOST: 52.78.19.134
    ports:
      - "8001:8001"
    depends_on:
      - redis-japan
     
  redis-mumbai:
    image: redis:7-alpine

  redis-virginia:
    image: redis:7-alpine

  redis-japan:
    image: redis:7-alpine


  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    
  redis:
    image: redis:7-alpine

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  router:
    build:
      context: .
      dockerfile: router/Dockerfile
    environment:
        ORIGIN_HOST: origin
    depends_on:
      - edge-mumbai
      - edge-virginia
      - edge-japan

volumes:
  grafana_data:  
  