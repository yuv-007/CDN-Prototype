services:

  origin:
    build:
      context: .
      dockerfile: origin/Dockerfile
    expose:
      - "8000"

  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    expose:
      - "8001"
    depends_on:
      - origin

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - edge